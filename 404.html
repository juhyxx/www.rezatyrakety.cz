<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evidentně saháte vedle · Rezatý Rakety</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0A0807">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;700&family=Special+Elite&display=swap">
    <style>
      :root {
        --cream: #DCCDBB;
        --black: #0A0807;
        --rust: #943616;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--cream);
        color: var(--black);
        font: 1.0625rem/1.6 'Fira Sans', system-ui, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        height: 4.25rem;
        padding: 0 clamp(1rem, 4vw, 2.5rem);
        background: var(--black);
        border-bottom: 3px solid var(--rust);
      }

      header img {
        display: block;
        height: 3.1rem;
        width: auto;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: clamp(2rem, 5vw, 4rem);
        align-items: center;
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
        padding: clamp(2.5rem, 7vw, 5rem) clamp(1rem, 4vw, 2.5rem);
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .code {
        margin: 0;
        font-family: 'Special Elite', 'Courier New', monospace;
        font-size: 1.1rem;
        color: var(--rust);
        letter-spacing: 0.1em;
      }

      h1 {
        margin: 0.25rem 0 1.5rem;
        font-family: 'Special Elite', 'Courier New', monospace;
        font-weight: 400;
        font-size: clamp(2.25rem, 4vw + 1rem, 3.75rem);
        line-height: 1.05;
      }

      h1::after {
        content: "";
        display: block;
        width: 5rem;
        height: 0.32rem;
        margin-top: 1rem;
        background: var(--rust);
      }

      ul {
        margin: 0 0 2rem;
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        padding: 0.35rem 0 0.35rem 1.6rem;
      }

      li::before {
        content: "";
        position: absolute;
        left: 0.2rem;
        top: 0.85rem;
        width: 0.6rem;
        height: 0.6rem;
        background: var(--rust);
        transform: rotate(45deg);
      }

      .btn {
        display: inline-block;
        padding: 0.75rem 1.3rem;
        border: 2px solid var(--black);
        background: var(--black);
        color: var(--cream);
        font-family: 'Special Elite', 'Courier New', monospace;
        text-transform: uppercase;
        text-decoration: none;
        box-shadow: 4px 4px 0 var(--rust);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }

      .btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--rust);
      }

      figure {
        margin: 0;
      }

      figure img {
        display: block;
        width: 100%;
        height: auto;
        transform: rotate(2deg);
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="Rezatý Rakety – úvodní stránka"><img src="/images/logo-nav.png" alt="Rezatý Rakety" width="130" height="115"></a>
    </header>
    <main>
      <div>
        <p class="code">Chyba 404</p>
        <h1>Evidentně saháte vedle</h1>
        <p>To se stává, pokud:</p>
        <ul>
          <li>snažíte se najít něco, co není</li>
          <li>vaše hrátky překročily rozumnou míru</li>
          <li>snažíte se ukojit své nízké touhy pronikáním do cizího soukromí</li>
          <li>děláte prostě blbostě</li>
        </ul>
        <a class="btn" href="/">Zpátky k Raketám</a>
      </div>
      <figure>
        <img src="/images/404.png" alt="Rezatý Rakety na staré fotce" width="561" height="398">
      </figure>
    </main>
  </body>
</html>
